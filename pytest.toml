[pytest]
addopts = [
  # The tests wait on wttr.in, so more workers than CPUs help; on CI, 16 are
  # no faster than 8.
  "-n=8",
  "--reruns=9",
  "--reruns-delay=1",
  "--only-rerun=ClientConnectorError",
  "--only-rerun=ClientResponseError",
  "--only-rerun=ConnectionTimeoutError",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error"]
strict = true
